<style>
:root{
  --blue:#006EB8; --blue-dk:#004E86; --blue-lt:#E5F1FA; --blue-br:#126BFD; --yellow:#FFC928; --yellow-dk:#E0A800;
  --ink:#0B2540; --muted:#5B7189; --line:#CFDDEA; --bg:#F3F8FC; --surface:#FFFFFF; --surface2:#EEF5FB;
  --danger:#C0392B; --ok:#1E7A4F; --warn:#9A6A00;
  --f-head:"Dela Gothic One","Arial Black",Impact,sans-serif; --f-body:"Rubik","Segoe UI",system-ui,sans-serif;
  --check:conic-gradient(var(--blue) 25%,#fff 0 50%,var(--blue) 0 75%,#fff 0) 0 0/20px 20px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-head);font-weight:400;margin:0;letter-spacing:.01em;color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-height:44px}
input:focus,select:focus,button:focus-visible,textarea:focus{outline:3px solid var(--yellow);outline-offset:0;border-color:var(--blue)}
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
label>input,label>select,label>textarea{margin-top:4px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.num{font-variant-numeric:tabular-nums;text-align:right}

#boot{position:fixed;inset:0;background:var(--blue);color:#fff;display:grid;place-items:center;z-index:100;text-align:center;font-family:var(--f-head)}
#boot img{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 14px}
#app{display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;min-height:0;width:100%;max-width:100vw}
nav.rail{background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 6px 10px;gap:4px;position:relative;overflow-y:auto}
nav.rail::after{content:"";position:absolute;top:0;bottom:0;right:0;width:10px;background:var(--check)}
.logo img{width:60px;height:60px;border-radius:16px;display:block;margin:2px 0 12px}
.navbtn{width:72px;background:transparent;border:0;border-radius:12px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;opacity:.8;font-size:11.5px;font-weight:500;margin-right:8px}
.navbtn svg{width:22px;height:22px}
.navbtn.on{background:var(--yellow);color:var(--ink);opacity:1;font-weight:700}
.rail .sp{flex:1}
.sync{font-size:10.5px;text-align:center;margin:6px 8px 4px 0;line-height:1.2;width:72px}
.sync i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9fb7cc;margin-right:4px}
.sync.ok i{background:#5be08f}.sync.syncing i{background:var(--yellow)}.sync.offline i{background:#ff7b6b}.sync.pending i{background:var(--yellow)}
main{overflow-x:hidden;overflow-y:auto;min-width:0;min-height:0;padding:20px 22px 30px}
main.pos-main{padding:0;overflow:hidden}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:28px}
.sub{color:var(--muted);font-size:14px}

.btn{border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:10px;padding:9px 14px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.accent{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-weight:700}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.danger{border-color:var(--line);color:var(--danger)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{background:var(--yellow);color:var(--ink);border-radius:99px;padding:0 8px;font-size:12px;font-weight:700;min-width:20px;text-align:center}
.badge:empty{display:none}

.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);height:100%;min-height:0;min-width:0}
.catalog{display:flex;flex-direction:column;min-height:0;min-width:0;padding:18px 16px 0 22px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1;min-width:170px}
.tabs{display:flex;background:#fff;border:2px solid var(--blue);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:7px 14px;min-height:36px;font-weight:500;color:var(--blue)}
.tabs button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;flex-shrink:0;min-width:0;max-width:100%}
.chips button{flex:0 0 auto}
.chips button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;min-height:36px;white-space:nowrap;font-weight:500}
.chips button.on{background:var(--yellow);border-color:var(--yellow);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;overflow:auto;padding:2px 4px 90px 2px;align-content:start}
.card{background:#fff;border:3px solid var(--blue);border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:170px;position:relative}
.card:active{transform:scale(.97)}
.card .ic{font-size:36px;line-height:1;background:var(--blue-lt);border-radius:10px;height:62px;display:grid;place-items:center}
.card .nm{font-weight:700;font-size:14px;line-height:1.2}
.card .st{font-size:12px;color:var(--muted)}
.card .pr{margin-top:auto;font-family:var(--f-head);color:var(--blue);font-size:17px;font-variant-numeric:tabular-nums}
.card .star{position:absolute;top:-2px;left:-2px;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;border-radius:13px 0 10px 0;padding:2px 9px}
.card.out{opacity:.5;cursor:not-allowed}
.card .qtybadge{position:absolute;top:8px;right:8px;background:var(--yellow);color:var(--ink);font-weight:700;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;padding:0 6px}

.order{background:#fff;border-left:3px solid var(--blue);display:flex;flex-direction:column;min-height:0;min-width:0;height:100%;overflow:hidden}
.order .oh{padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.order .oh h2{font-size:19px}
.order .ident{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 12px;border-bottom:2px dashed var(--line)}
.lines{flex:1;overflow:auto;padding:6px 18px}
.line{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.line .ic{font-size:24px;background:var(--blue-lt);border-radius:10px;height:40px;display:grid;place-items:center}
.line .t{font-weight:500;line-height:1.2}
.line .s{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);font-size:18px;line-height:1}
.step span{min-width:26px;text-align:center;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:34px 12px;font-size:14px}
.order .foot{border-top:2px solid var(--blue);padding:12px 18px 16px;display:grid;gap:9px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-family:var(--f-head);font-weight:400;font-size:26px;color:var(--blue)}
.order .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cartbar,.x{display:none}

.panel{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.stack>*,.two>*{min-width:0}
.panel h3{font-size:16px;margin-bottom:10px}
.stack{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th.num{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--blue);border-bottom:0}
tr.sec td{background:var(--blue-lt);font-weight:700;color:var(--blue)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:500;background:var(--surface2);border:1px solid var(--line)}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--danger)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:99px;padding:7px 16px;min-height:40px;font-weight:500}
.subtabs button.on{background:var(--blue);color:#fff}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--blue);border-radius:16px;overflow:hidden;color:#fff}
.strip>div{padding:16px 18px;border-right:2px solid rgba(255,255,255,.25)}
.strip>div:last-child{border-right:0}
.strip .k{font-size:13px;opacity:.85}
.strip .v{font-family:var(--f-head);font-size:26px;margin-top:2px;font-variant-numeric:tabular-nums}
.strip .v.y{color:var(--yellow)}
.strip .n{font-size:13px;opacity:.85}
.marginbar{display:flex;height:36px;border-radius:9px;overflow:hidden;margin:10px 0 8px;background:var(--surface2)}
.marginbar div{display:grid;place-items:center;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.bars .b i{display:block;width:100%;background:var(--blue);border-radius:5px 5px 0 0;min-height:2px}
.bars .b i.pk{background:var(--yellow)}
#modal{position:fixed;inset:0;background:rgba(0,40,80,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
.sheet{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:20px;border:3px solid var(--blue)}
.sheet.wide{max-width:780px}
.sheet h2{font-size:21px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface2);border-radius:10px;min-height:48px;font-weight:700}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.qk{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qk button{border:2px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 14px;min-height:38px}
.billcard{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.receipt{font-family:"Courier New",monospace;font-size:13px;background:#fff;color:#000;padding:16px;border-radius:8px;border:2px dashed #999;max-width:330px;margin:0 auto}
.receipt hr{border:0;border-top:1px dashed #555;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt img{width:56px;height:56px;border-radius:12px;display:block;margin:0 auto 6px}
.receipt .wifi{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:500;z-index:90;display:none;max-width:90%;text-align:center}
textarea.tsv{min-height:100px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.note{font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:1fr 120px 44px;gap:8px;margin-bottom:8px;align-items:center}
.check{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:14px}
.strip .dl{display:block;font-size:12px;margin-top:2px}
.strip .dl.up{color:var(--yellow)}.strip .dl.dn{color:#FFB4A8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .k{font-size:13px;color:var(--muted)}.kpi .v{font-family:var(--f-head);font-size:19px;color:var(--blue);overflow-wrap:anywhere}
.bars.tall{height:180px;gap:8px}.bars.dense{gap:3px}.bars.dense .b{font-size:9px}
.bars .stk{width:100%;display:flex;flex-direction:column;min-height:2px;border-radius:5px 5px 0 0;overflow:hidden}
.bars .stk i{display:block;width:100%;min-height:0;border-radius:0;background:var(--blue)}
.bars .stk i.hp{background:#F08A7E}.bars .stk.best i.mg{background:var(--yellow)}
.bars .b{text-align:center;line-height:1.15}
@media (max-width:1000px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .catalog{padding:14px 14px 0}
  .order{position:fixed;inset:0;z-index:40;transform:translateY(100%);transition:transform .2s;border-left:0}
  .order.open{transform:none}
  .x{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--line);background:var(--surface2);border-radius:10px}
  .cartbar{display:flex;position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--yellow);color:var(--ink);border:3px solid var(--blue);border-radius:14px;padding:12px 18px;font-weight:700;justify-content:space-between;min-height:50px}
  .cartbar[hidden]{display:none}
  .strip{grid-template-columns:1fr 1fr}
  .strip>div:nth-child(2){border-right:0}
  .strip>div:nth-child(-n+2){border-bottom:2px solid rgba(255,255,255,.25)}
  .two{grid-template-columns:1fr}
}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  nav.rail{flex-direction:row;order:2;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible}
  nav.rail::after{top:0;bottom:auto;left:0;right:0;width:auto;height:6px}
  .logo,.rail .sp,.sync{display:none}
  .navbtn{width:auto;flex:1;padding:8px 2px 4px;font-size:10.5px;margin-right:0}
  main{padding:14px 14px 24px}
  .page-h h1{font-size:22px}
  .strip .v{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.mcard .mi{width:42px;height:42px;border-radius:12px;background:var(--blue-lt);display:grid;place-items:center;font-size:20px;flex:0 0 42px}
.mcard .mk{font-size:12.5px;color:var(--muted)}
.mcard .mv{font-family:var(--f-head);font-size:24px;color:var(--blue);line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.avatar{width:38px;height:38px;border-radius:11px;background:var(--blue-lt);display:grid;place-items:center;font-size:19px;flex:0 0 38px}
.mrowname{display:flex;gap:10px;align-items:center;min-width:0}
.mpill{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.mpill.g{background:#E4F4EB;color:var(--ok)}.mpill.y{background:#FFF3D1;color:var(--warn)}.mpill.r{background:#FBE6E3;color:var(--danger)}
.rank{width:24px;height:24px;border-radius:8px;background:var(--blue-lt);color:var(--blue);display:inline-grid;place-items:center;font-weight:700;font-size:12px}
.lnote{font-size:12px;color:var(--warn);background:#FFF6DC;border:1px solid #F2DFA6;border-radius:8px;padding:3px 8px;margin-top:5px;display:inline-block;overflow-wrap:anywhere}
.notebtn{border:1px dashed var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:3px 10px;font-size:12px;min-height:0;margin-top:5px}
.notebtn:hover{border-color:var(--blue);color:var(--blue)}
.order .line{align-items:flex-start}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.presets button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:13px;min-height:38px;color:var(--blue)}
.presets button:hover{border-color:var(--blue)}
.invhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

.tblwrap{padding:20px 22px 30px;height:100%;overflow:auto}
.tblwrap .th{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tblwrap .th h1{font-size:26px}
.tblgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.tbl{background:#fff;border:3px solid var(--blue);border-radius:16px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;position:relative}
.tbl:active{transform:scale(.97)}
.tbl .ti{font-size:30px;line-height:1}
.tbl .tn{font-weight:700;font-size:15px}
.tbl .tst{font-size:11.5px;color:var(--muted)}
.tbl.occ{background:var(--blue-lt);border-color:var(--yellow)}
.tbl.occ .tst{color:var(--warn);font-weight:700}
.tbl .tbadge{position:absolute;top:-8px;right:-8px;background:var(--yellow);color:var(--ink);font-weight:700;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;padding:0 6px;border:2px solid #fff}

const $=s=>document.querySelector(s);
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n||0)).toLocaleString('id-ID');
const nf=n=>(Math.round((n||0)*100)/100).toLocaleString('id-ID');
const pad=(n,l=2)=>String(n).padStart(l,'0');
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const todayKey=()=>dkey(Date.now());
const tsFromKey=k=>k===todayKey()?Date.now():new Date(k+'T12:00:00').getTime();
const fmtDate=ts=>new Date(ts).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const fmtTime=ts=>new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const rpd=n=>'Rp'+(n||0).toLocaleString('id-ID',{maximumFractionDigits:2});
function parseNum(s){s=String(s==null?'':s).trim();if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return parseFloat(s)}
const hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h.toString(36)+'.'+s.length};
function readImageCompressed(file,maxW){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width),w=Math.round(img.width*scale)||1,h=Math.round(img.height*scale)||1;
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.6));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Gagal membaca foto'))};
    img.src=url;
  });
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}

const idb={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('piyee-pos',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}},
  async set(k,v){try{const db=await this.open();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
};

let synced={},lastVer=0,syncing=false,again=false,pendingChanges=false,retryT=null,cacheT=null;
const rowsOf=t=>t==='settings'?[Object.assign({id:1},DB.settings)]:DB[t];
function setStatus(s,msg){
  const el=$('#sync');if(!el)return;
  const txt={local:'Mode lokal',ok:'Tersinkron',syncing:'Menyimpan…',pending:'Menunggu…',offline:'Offline · antre'}[s];
  el.className='sync '+s;el.title=msg||'';el.innerHTML='<i></i>'+txt;
}
async function api(action,payload){
  if(!CFG.API_URL)throw new Error('API belum diatur');
  const r=await fetch(CFG.API_URL,{method:'POST',body:JSON.stringify(Object.assign({token:CFG.TOKEN,action},payload||{}))});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Permintaan ditolak');return j;
}
function buildOps(){
  const ops=[];
  TABLES.forEach(t=>{
    const cur=rowsOf(t),s=synced[t]||(synced[t]={}),u=[],h={},seen={};
    cur.forEach(r=>{seen[r.id]=1;const x=hs(JSON.stringify(r));if(s[r.id]!==x){u.push(r);h[r.id]=x}});
    const d=Object.keys(s).filter(id=>!seen[id]).map(Number);
    if(u.length||d.length)ops.push({t,u,d,h});
  });
  return ops;
}
function commit(t,u,d,h){const s=synced[t]||(synced[t]={});u.forEach(r=>{s[r.id]=h[r.id]});d.forEach(id=>{delete s[id]})}
function save(){
  pendingChanges=true;
  clearTimeout(cacheT);cacheT=setTimeout(()=>idb.set('cache',{db:DB,synced,ver:lastVer}),500);
  if(!CFG.API_URL){setStatus('local');return}
  setStatus('pending');clearTimeout(save.t);save.t=setTimeout(flush,600);
}
async function flush(){
  if(!CFG.API_URL)return;
  if(syncing){again=true;return}
  syncing=true;
  try{
    const ops=buildOps();
    if(!ops.length){pendingChanges=false;setStatus('ok');return}
    setStatus('syncing');
    for(const op of ops){
      for(let i=0;i<op.u.length;i+=120){const part=op.u.slice(i,i+120);const j=await api('sync',{ops:[{t:op.t,u:part,d:[]}]});commit(op.t,part,[],op.h);noteVer(j.version)}
      if(op.d.length){const j=await api('sync',{ops:[{t:op.t,u:[],d:op.d}]});commit(op.t,[],op.d,op.h);noteVer(j.version)}
    }
    pendingChanges=false;setStatus('ok');
    clearTimeout(cacheT);cacheT=setTimeout(()=>idb.set('cache',{db:DB,synced,ver:lastVer}),200);
  }catch(e){setStatus('offline',e.message);clearTimeout(retryT);retryT=setTimeout(flush,10000)}
  finally{syncing=false;if(again){again=false;flush()}}
}
function noteVer(v){if(v===lastVer+1)lastVer=v}
function snapshotSynced(){synced={};TABLES.forEach(t=>{const s=synced[t]={};rowsOf(t).forEach(r=>{s[r.id]=hs(JSON.stringify(r))})})}
function applyRemote(d,ver){
  DB=blankDB();
  TABLES.forEach(t=>{if(t==='settings'){if(d.settings&&d.settings[0]){const s=Object.assign({},d.settings[0]);delete s.id;Object.assign(DB.settings,s)}}else DB[t]=d[t]||[]});
  snapshotSynced();lastVer=ver||0;pendingChanges=false;
  idb.set('cache',{db:DB,synced,ver:lastVer});
}
async function pullNow(){const d=(await api('load')).data;const v=(await api('version')).version;applyRemote(d,v)}
function startPolling(){
  setInterval(async()=>{
    if(!CFG.API_URL||syncing||pendingChanges||document.hidden)return;
    try{const v=(await api('version')).version;if(v!==lastVer&&!pendingChanges){await pullNow();softRefresh();setStatus('ok')}}catch(e){setStatus('offline',e.message)}
  },15000);
}
function softRefresh(){
  const a=document.activeElement;if($('#modal').classList.contains('on'))return;
  if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  if(view==='kasir'){updateGrid();updateCart()}else render();
}
async function init(){
  renderNav();
  const cache=await idb.get('cache');
  if(cache&&cache.db){DB=cache.db;fixDB();synced=cache.synced||{};lastVer=cache.ver||0}
  if(CFG.API_URL){
    try{
      const d=(await api('load')).data,empty=!(d.menus||[]).length&&!(d.materials||[]).length&&!(d.orders||[]).length;
      if(empty){if(!DB){DB=blankDB();seedMaster()}synced={};lastVer=(await api('version')).version;pendingChanges=true;setStatus('pending');flush()}
      else{
        if(DB&&pendingChanges===false&&cache&&Object.keys(synced).length){/* dorong antrean offline lebih dulu */const ops=buildOps();if(ops.length){pendingChanges=true;await flush()}}
        await pullNow();setStatus('ok');
      }
    }catch(e){if(!DB){DB=blankDB();seedMaster()}setStatus('offline',e.message)}
  }else{if(!DB){DB=blankDB();seedMaster();save()}setStatus('local')}
  fixDB();$('#boot').remove();render();startPolling();
}

function orderNoFor(ts){const k=dkey(ts),d=new Date(ts);const n=DB.orders.filter(o=>dkey(o.createdAt)===k).length+1;return pad(d.getDate())+pad(d.getMonth()+1)+'-'+pad(n,3)}
function addJournal(refType,refId,desc,ts,lines){
  const D=lines.reduce((s,l)=>s+(l.d||0),0),C=lines.reduce((s,l)=>s+(l.c||0),0);
  if(Math.round(D)!==Math.round(C))throw new Error('Jurnal tidak seimbang');
  const id=nid();DB.journals.push({id,refType,refId,description:desc,ts});
  lines.forEach(l=>DB.journalLines.push({id:nid(),journalId:id,accountCode:l.acc,debit:Math.round(l.d||0),credit:Math.round(l.c||0)}));
}
function removeJournals(fn){const ids=DB.journals.filter(fn).map(j=>j.id);DB.journals=DB.journals.filter(j=>!ids.includes(j.id));DB.journalLines=DB.journalLines.filter(l=>!ids.includes(l.journalId))}
function postOrder(o){
  const cons={};let cogs=0,food=0,drink=0;
  o.items.forEach(it=>{
    const m=getMenu(it.menuId);let unit=0;
    if(m)m.recipe.forEach(r=>{const mat=getMat(r.materialId);if(!mat)return;unit+=r.qty*mat.cost;cons[r.materialId]=(cons[r.materialId]||0)+r.qty*it.qty});
    it.cogs=Math.round(unit*it.qty);cogs+=it.cogs;
    if(it.category==='Makanan')food+=it.subtotal;else drink+=it.subtotal;
  });
  Object.entries(cons).forEach(([id,q])=>{const m=getMat(+id);if(m)m.stock-=q});
  o.consumption=cons;o.total=food+drink;o.cogs=cogs;
  const lines=[{acc:o.status==='Paid'?'101':'102',d:o.total}];
  if(food)lines.push({acc:'401',c:food});if(drink)lines.push({acc:'402',c:drink});
  if(cogs)lines.push({acc:'501',d:cogs},{acc:'103',c:cogs});
  addJournal('Order',o.id,'Penjualan '+o.no+(o.status==='Paid'?' (Bayar Sekarang)':' (Open Bill)'),o.createdAt,lines);
}
function unpostOrder(o){
  Object.entries(o.consumption||{}).forEach(([id,q])=>{const m=getMat(+id);if(m)m.stock+=q});
  o.consumption={};removeJournals(j=>j.refId===o.id&&(j.refType==='Order'||j.refType==='Pelunasan'));
}
function settleOrder(id,method,tendered){
  const o=getOrder(id);o.status='Paid';o.paymentMethod=method;o.paidAt=Date.now();o.tendered=tendered;
  addJournal('Pelunasan',o.id,'Pelunasan Open Bill '+o.no,Date.now(),[{acc:'101',d:o.total},{acc:'102',c:o.total}]);save();
}
const menuHPP=m=>m.recipe.reduce((s,r)=>{const mat=getMat(r.materialId);return s+(mat?r.qty*mat.cost:0)},0);
const menuBreakdown=m=>m.recipe.map(r=>{const mat=getMat(r.materialId);return mat?{name:mat.name,unit:mat.unit,qty:r.qty,cost:r.qty*mat.cost}:null}).filter(Boolean);
const isNormalDebit=c=>{const t=ACCOUNTS.find(a=>a.code===c).type;return t==='Asset'||t==='Expense'};
const jmap=()=>{const m={};DB.journals.forEach(j=>m[j.id]=j);return m};
function jref(j){if(j.refType==='Order'||j.refType==='Pelunasan'){const o=getOrder(j.refId);return j.refType+(o?' '+o.no:'')}return j.refType}
function ledger(code,from,to){
  const jm=jmap(),nd=isNormalDebit(code);
  const ls=DB.journalLines.filter(l=>l.accountCode===code&&jm[l.journalId]).map(l=>({l,j:jm[l.journalId]})).sort((a,b)=>a.j.ts-b.j.ts||a.j.id-b.j.id);
  let bal=0,td=0,tc=0;const rows=[];let opening=0;
  ls.forEach(({l,j})=>{const dl=nd?l.debit-l.credit:l.credit-l.debit;
    if(j.ts<from){bal+=dl;opening+=dl;return}if(j.ts>to)return;
    bal+=dl;td+=l.debit;tc+=l.credit;rows.push({ts:j.ts,desc:j.description,ref:jref(j),debit:l.debit,credit:l.credit,bal})});
  return{rows,opening,closing:bal,td,tc};
}
function accSum(code,from,to){const jm=jmap();let d=0,c=0;DB.journalLines.forEach(l=>{if(l.accountCode!==code)return;const j=jm[l.journalId];if(j&&j.ts>=from&&j.ts<=to){d+=l.debit;c+=l.credit}});return{d,c}}

function tableActiveOrders(t){return DB.orders.filter(o=>o.tableNumber===t&&!o.tableCleared&&(o.status==='Open Bill'||o.status==='Paid')).sort((a,b)=>a.createdAt-b.createdAt)}
function pickTable(t){
  if(t==='Take Away'){resetCart();cart.table=t;posStep='order';render();return}
  const obs=tableActiveOrders(t);
  if(!obs.length){resetCart();cart.table=t;posStep='order';render();return}
  showTableBills(t);
}
function startNewStack(t){resetCart();cart.table=t;posStep='order';closeModal();render()}
function toggleServed(id){const o=getOrder(id);o.served=!o.served;save();refreshTableBills(o.tableNumber)}
function clearFromTable(id){const o=getOrder(id);o.tableCleared=true;save();toast(o.no+' dihapus dari daftar meja');refreshTableBills(o.tableNumber)}
function clearTable(t){
  tableActiveOrders(t).forEach(o=>{if(o.status==='Open Bill'){unpostOrder(o);o.status='Canceled'}o.tableCleared=true});
  save();closeModal();toast(t+' dikosongkan kembali');render();
}
function refreshTableBills(t){if(tableActiveOrders(t).length)showTableBills(t);else closeModal()}
function showTableBills(t){
  const obs=tableActiveOrders(t),totalRp=obs.reduce((s,o)=>s+o.total,0),unpaid=obs.filter(o=>o.status==='Open Bill').length;
  openModal(`<h2>${esc(t)}</h2><p class="note" style="margin:-6px 0 14px">${obs.length} pesanan tercatat \u00b7 total ${rp(totalRp)}${unpaid?` \u00b7 ${unpaid} belum dibayar`:' \u00b7 semua sudah dibayar'}. Bisa menambah pesanan baru untuk teman yang menyusul. Meja tetap tercatat di sini walau sudah lunas, sampai Anda hapus sendiri.</p>
  ${obs.map(o=>`<div class="billcard"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${esc(o.no)}${o.customerName?' \u00b7 '+esc(o.customerName):''}</b>
  <span class="row" style="gap:6px"><span class="tag ${o.status==='Paid'?'ok':'warn'}">${o.status==='Paid'?'Lunas':'Belum bayar'}</span><span class="tag ${o.served?'ok':'warn'}">${o.served?'Sudah disajikan':'Belum disajikan'}</span></span></div>
  <div class="note">${fmtTime(o.createdAt)} \u00b7 ${o.items.map(i=>i.qty+'\u00d7 '+esc(i.name)+(i.note?' ('+esc(i.note)+')':'')).join(', ')}</div>
  <div class="row" style="justify-content:space-between;margin-top:4px"><span class="note" style="margin:0">Total</span><b>${rp(o.total)}</b></div>
  <div class="row" style="margin-top:10px;flex-wrap:wrap">
  ${o.status==='Open Bill'?`<button class="btn sm" onclick="loadBill(${o.id})">Tambah item</button><button class="btn sm accent" onclick="closeModal();openPay(${o.id})">Lunasi</button><button class="btn sm" onclick="receiptModal(${o.id},'prebill')">Cetak tagihan</button><button class="btn sm danger" onclick="askConfirm('Batalkan ${esc(o.no)}? Stok dikembalikan dan jurnal dihapus.',()=>{cancelBill(${o.id});refreshTableBills('${t}')})">Batalkan</button>`
  :`<button class="btn sm" onclick="receiptModal(${o.id},'nota')">Cetak nota</button><button class="btn sm ${o.served?'':'accent'}" onclick="toggleServed(${o.id})">${o.served?'Tandai belum disajikan':'Tandai sudah disajikan'}</button><button class="btn sm ghost" onclick="askConfirm('Hapus ${esc(o.no)} dari daftar meja ini? Nota tetap tersimpan di Laporan.',()=>clearFromTable(${o.id}))">Hapus dari meja</button>`}
  </div></div>`).join('')}
  <div class="row" style="justify-content:space-between;margin-top:6px;flex-wrap:wrap;gap:10px"><button class="btn danger" style="border-color:var(--danger);color:var(--danger)" onclick="askConfirm('Kosongkan ${esc(t)}? ${unpaid?unpaid+' pesanan belum bayar akan dibatalkan (stok dikembalikan), dan ':''}semua pesanan lunas akan dihapus dari daftar meja ini.',()=>clearTable('${t}'))">Kosongkan meja</button>
  <div class="row" style="gap:8px"><button class="btn ghost" onclick="closeModal()">Tutup</button><button class="btn primary" onclick="startNewStack('${t}')">+ Pesanan baru di meja ini</button></div></div>`,true);
}
function renderPilihMeja(){
  const cards=tableList().map(t=>{
    const obs=t!=='Take Away'?tableActiveOrders(t):[];
    const items=obs.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.qty,0),0),totalRp=obs.reduce((s,o)=>s+o.total,0);
    const unserved=obs.some(o=>!o.served),unpaid=obs.some(o=>o.status==='Open Bill');
    const dot=!obs.length?'':unpaid?'r':unserved?'y':'g';
    return `<button class="tbl ${obs.length?'occ':''}" onclick="pickTable('${t}')">${obs.length?`<span class="tbadge ${dot}">${obs.length>1?obs.length+'\u00d7':items}</span>`:''}
      <div class="ti">${t==='Take Away'?'\ud83e\udd61':'\ud83c\udf7d\ufe0f'}</div><div class="tn">${t}</div>
      <div class="tst">${obs.length?(obs.length>1?obs.length+' pesanan \u00b7 ':'')+rp(totalRp):'Kosong'}</div>
      ${obs.length?`<div class="tst" style="font-weight:700;color:${unpaid?'var(--danger)':unserved?'var(--warn)':'var(--ok)'}">${unpaid?'Belum lunas':unserved?'Belum disajikan':'Siap dikosongkan'}</div>`:''}</button>`;}).join('');
  $('#main').innerHTML=`<div class="tblwrap"><div class="th"><div><h1>Pilih Meja</h1><div class="sub">Ketuk nomor meja untuk mulai memesan. Meja yang terisi menampilkan daftar pesanan yang sedang berjalan \u2014 bisa ditumpuk kalau ada teman menyusul, tetap tercatat walau sudah lunas, dan dikosongkan sendiri setelah semua selesai.</div></div>
    <button class="btn" onclick="openBills()">Open Bill <span class="badge">${DB.orders.filter(o=>o.status==='Open Bill').length||''}</span></button></div>
    <div class="tblgrid">${cards}</div>
    <p class="note tblnote">Take Away tidak memerlukan nomor meja dan bisa dipesan berkali-kali sekaligus.</p></div>`;
}
const cartTotal=()=>cart.items.reduce((s,i)=>s+getMenu(i.menuId).price*i.qty,0);
const cartCount=()=>cart.items.reduce((s,i)=>s+i.qty,0);
function portions(m){if(!m.recipe.length)return Infinity;return Math.min(...m.recipe.map(r=>{const mat=getMat(r.materialId);return mat?Math.floor(mat.stock/r.qty):0}))}
function canAdd(m){
  if(!DB.settings.strict||cart.orderId)return true;
  const used={};cart.items.forEach(i=>getMenu(i.menuId).recipe.forEach(r=>used[r.materialId]=(used[r.materialId]||0)+r.qty*i.qty));
  return m.recipe.every(r=>{const mat=getMat(r.materialId);return mat&&mat.stock>=(used[r.materialId]||0)+r.qty});
}
function renderKasir(){
  if(posStep!=='order'||!cart.table){renderPilihMeja();return}
  $('#main').innerHTML=`<section class="pos"><div class="catalog">
    <div class="toolbar"><button class="btn" onclick="posStep='table';render()" aria-label="Ganti meja">\u2190 ${esc(cart.table)}</button><div class="search"><input id="q" type="search" placeholder="Cari menu…" oninput="updateGrid()" aria-label="Cari menu"></div>
    <div class="tabs" id="catTabs"></div><button class="btn" onclick="openBills()">Open Bill <span class="badge" id="billBadge"></span></button></div>
    <div class="chips" id="grpTabs"></div><div class="grid" id="grid"></div></div>
    <aside class="order open" id="orderPanel"></aside></section><button class="cartbar" id="cartbar" onclick="toggleOrder(true)"></button>`;
  updateGrid();updateCart();
}
function updateGrid(){
  if(!$('#grid'))return;
  $('#catTabs').innerHTML=['Semua','Makanan','Minuman'].map(c=>`<button class="${cat===c?'on':''}" onclick="cat='${c}';grp='Semua';updateGrid()">${c}</button>`).join('');
  const groups=[...new Set(DB.menus.filter(m=>cat==='Semua'||m.category===cat).map(m=>m.group).filter(Boolean))];
  if(grp!=='Semua'&&!groups.includes(grp))grp='Semua';
  $('#grpTabs').innerHTML=['Semua',...groups].map(g=>`<button class="${grp===g?'on':''}" data-g="${esc(g)}" onclick="grp=this.dataset.g;updateGrid()">${esc(g)}</button>`).join('');
  const q=($('#q')||{value:''}).value.trim().toLowerCase();
  const list=DB.menus.filter(m=>(cat==='Semua'||m.category===cat)&&(grp==='Semua'||m.group===grp)&&m.name.toLowerCase().includes(q));
  $('#grid').innerHTML=list.length?list.map(m=>{
    const p=portions(m),inCart=cart.items.filter(i=>i.menuId===m.id).reduce((s,i)=>s+i.qty,0),out=DB.settings.strict&&p<1&&!cart.orderId;
    const st=p===Infinity?m.group:p<1?'Stok bahan kosong':p<=5?'Sisa '+p+' porsi':m.group;
    return `<button class="card ${out?'out':''}" ${out?'disabled':''} onclick="addToCart(${m.id})">${m.group==='Signature'?'<span class="star">★ Signature</span>':''}${inCart?`<span class="qtybadge">${inCart}</span>`:''}
      <div class="ic">${esc(m.icon)}</div><div class="nm">${esc(m.name)}</div><div class="st">${esc(st||'')}</div><div class="pr">${rp(m.price)}</div></button>`}).join(''):'<div class="empty" style="grid-column:1/-1">Menu tidak ditemukan. Coba kata kunci lain.</div>';
  const b=$('#billBadge');if(b)b.textContent=DB.orders.filter(o=>o.status==='Open Bill').length||'';
}
function addToCart(id){const m=getMenu(id);if(!canAdd(m)){toast('Stok bahan '+m.name+' tidak cukup');return}
  const it=cart.items.find(i=>i.menuId===id&&!i.note);if(it)it.qty++;else cart.items.push({menuId:id,qty:1,note:''});updateCart();updateGrid()}
function chgIdx(ix,d){const it=cart.items[ix];if(!it)return;if(d>0&&!canAdd(getMenu(it.menuId))){toast('Stok bahan tidak cukup');return}
  it.qty+=d;if(it.qty<=0)cart.items.splice(ix,1);updateCart();updateGrid()}
const PRESETS=['Less ice','No ice','Less sugar','Tanpa gula','Extra shot','Panas','Dingin','Pedas','Tidak pedas','Take away','Pisah saus'];
function openNote(ix){const it=cart.items[ix];if(!it)return;const m=getMenu(it.menuId);
  openModal(`<h2>Catatan item</h2><p class="note" style="margin:-6px 0 12px">${esc(m.icon)} ${esc(m.name)} · catatan ini ikut tercetak di tiket dapur/bar dan nota.</p>
  <label>Catatan<textarea id="cnote" rows="3" placeholder="mis. Less ice, tanpa gula, extra shot">${esc(it.note||'')}</textarea></label>
  <div class="presets">${PRESETS.map(t=>`<button onclick="addPreset('${t}')">${t}</button>`).join('')}</div>
  <div class="row" style="justify-content:flex-end;margin-top:16px;gap:8px">${it.note?`<button class="btn ghost danger" onclick="clearNote(${ix})">Hapus catatan</button>`:''}<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveNote(${ix})">Simpan catatan</button></div>`);
  setTimeout(()=>{const e=$('#cnote');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},60);
}
function addPreset(t){const e=$('#cnote');e.value=e.value.trim()?e.value.trim()+', '+t:t;e.focus()}
function clearNote(ix){cart.items[ix].note='';closeModal();updateCart()}
function saveNote(ix){const v=$('#cnote').value.trim().slice(0,120),it=cart.items[ix];
  const tw=cart.items.find((x,j)=>j!==ix&&x.menuId===it.menuId&&(x.note||'')===v);
  if(tw){tw.qty+=it.qty;cart.items.splice(ix,1)}else it.note=v;
  closeModal();updateCart()}
function toggleOrder(on){const p=$('#orderPanel');if(p)p.classList.toggle('open',on)}
function tableOptions(){
  const occ=new Set(DB.orders.filter(o=>o.status==='Open Bill'&&o.id!==cart.orderId).map(o=>o.tableNumber));
  const t=['Take Away'];for(let i=1;i<=12;i++)t.push('Meja '+i);
  return t.map(x=>`<option value="${x}" ${cart.table===x?'selected':''}>${x}${occ.has(x)&&x!=='Take Away'?' · terisi':''}</option>`).join('');
}
function updateCart(){
  const p=$('#orderPanel');if(!p)return;
  const total=cartTotal(),n=cartCount(),keep=p.classList.contains('open');
  p.innerHTML=`<div class="oh"><h2>${cart.orderId?'Open Bill '+esc((getOrder(cart.orderId)||{}).no):'Pesanan baru'}</h2><div class="row"><button class="btn sm" ${n?'':'disabled'} onclick="printTicketFor(cartAsOrder())" title="Cetak tiket dapur/bar">Tiket</button><button class="x" onclick="toggleOrder(false)" aria-label="Tutup">✕</button></div></div>
    <div class="ident"><label>Meja<div class="row" style="gap:8px;align-items:center"><b style="font-size:16px;color:var(--blue)">${esc(cart.table)}</b><button class="btn sm ghost" onclick="posStep='table';toggleOrder(false);render()">Ganti</button></div></label>
    <label>Nama pelanggan<input value="${esc(cart.name)}" placeholder="Opsional" oninput="cart.name=this.value"></label></div>
    <div class="lines">${cart.items.length?cart.items.map((i,ix)=>{const m=getMenu(i.menuId);return `<div class="line"><div class="ic">${esc(m.icon)}</div><div><div class="t">${esc(m.name)}</div><div class="s">${rp(m.price)} × ${i.qty} = ${rp(m.price*i.qty)}</div>
      ${i.note?`<div class="lnote">📝 ${esc(i.note)}</div><br>`:''}<button class="notebtn" onclick="openNote(${ix})">${i.note?'Ubah catatan':'+ Catatan'}</button></div>
      <div class="step"><button onclick="chgIdx(${ix},-1)" aria-label="Kurangi">−</button><span>${i.qty}</span><button onclick="chgIdx(${ix},1)" aria-label="Tambah">+</button></div></div>`}).join(''):'<div class="empty">Belum ada item. Ketuk kartu menu untuk menambahkan.</div>'}</div>
    <div class="foot"><div class="total"><span class="sub">Total (${n} item)</span><b>${rp(total)}</b></div>
      <div class="btns"><button class="btn" ${n?'':'disabled'} onclick="saveOpenBill()">Bayar nanti</button><button class="btn accent" ${n?'':'disabled'} onclick="openPay('cart')">Bayar sekarang</button></div>
      <button class="btn ghost sm" onclick="resetCart();render()">${cart.orderId?'Lepas bill ini':'Kosongkan pesanan'}</button></div>`;
  if(keep)p.classList.add('open');
  const cb=$('#cartbar');if(cb){cb.hidden=!n;cb.innerHTML=`<span>Pesanan · ${n} item</span><span>${rp(total)}</span>`}
}
function commitCart(status,method,tendered){
  let o;
  if(cart.orderId){o=getOrder(cart.orderId);unpostOrder(o)}else{o={id:nid(),createdAt:Date.now(),served:false,tableCleared:false};o.no=orderNoFor(o.createdAt);DB.orders.push(o)}
  o.customerName=cart.name.trim();o.tableNumber=cart.table;o.status=status;o.paymentMethod=status==='Paid'?method:'Pay Later';o.tendered=tendered||0;
  if(status==='Paid')o.paidAt=Date.now();
  o.items=cart.items.filter(i=>getMenu(i.menuId)).map(i=>{const m=getMenu(i.menuId);return{menuId:m.id,name:m.name,category:m.category,qty:i.qty,note:(i.note||''),price:m.price,subtotal:m.price*i.qty,cogs:0}});
  postOrder(o);save();resetCart();return o;
}
function saveOpenBill(){
  const o=commitCart('Open Bill');toggleOrder(false);render();
  toast('Open Bill '+o.no+' tersimpan sebagai piutang');
  openModal(`<h2>Open Bill tersimpan</h2><p>${esc(o.tableNumber)} · ${rp(o.total)} tercatat di Piutang Usaha.</p><div class="row" style="flex-wrap:wrap;margin-top:12px"><button class="btn" onclick="printTicketFor(getOrder(${o.id}))">Cetak tiket dapur/bar</button><button class="btn" onclick="receiptModal(${o.id},'prebill')">Cetak tagihan</button><button class="btn primary" onclick="closeModal()">Selesai</button></div>`);
}
let pay={};
function openPay(target){const total=target==='cart'?cartTotal():getOrder(target).total;if(!total)return;pay={target,method:'Cash',tendered:total,total};renderPay()}
function renderPay(){
  const cash=pay.method==='Cash',t=pay.total;
  const q=[...new Set([t,Math.ceil(t/10000)*10000,Math.ceil(t/50000)*50000,100000].filter(v=>v>=t))];
  openModal(`<h2>Pembayaran</h2><div class="total" style="margin-bottom:14px"><span class="sub">Total tagihan</span><b>${rp(t)}</b></div>
    <div class="seg"><button class="${cash?'on':''}" onclick="pay.method='Cash';pay.tendered=pay.total;renderPay()">Tunai</button><button class="${!cash?'on':''}" onclick="pay.method='Qris';pay.tendered=pay.total;renderPay()">QRIS</button></div>
    ${cash?`<label style="margin-top:14px">Uang diterima<input id="tender" inputmode="numeric" value="${pay.tendered}" oninput="pay.tendered=+this.value.replace(/\\D/g,'')||0;updateChange()"></label>
    <div class="qk">${q.map((v,i)=>`<button onclick="setTender(${v})">${i?rp(v):'Uang pas'}</button>`).join('')}</div>
    <div class="total" style="margin-top:14px"><span class="sub">Kembalian</span><b id="chg"></b></div>`:'<p class="note" style="margin-top:14px">Minta pelanggan memindai QRIS, lalu konfirmasi setelah pembayaran masuk.</p>'}
    <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" id="payok" onclick="confirmPay()">Konfirmasi pembayaran</button></div>`);
  if(cash)updateChange();
}
function setTender(v){pay.tendered=v;$('#tender').value=v;updateChange()}
function updateChange(){const d=pay.tendered-pay.total;$('#chg').textContent=d>=0?rp(d):'Kurang '+rp(-d);$('#payok').disabled=d<0}
function confirmPay(){
  let id;
  if(pay.target==='cart'){id=commitCart('Paid',pay.method,pay.method==='Cash'?pay.tendered:pay.total).id;toggleOrder(false)}
  else{id=pay.target;settleOrder(id,pay.method,pay.method==='Cash'?pay.tendered:pay.total);posStep='table'}
  showReceipt(id);if(view==='kasir')render();if(DB.settings.autoPrint)printReceipt(id,'nota');
}
function receiptModal(id,mode){
  const o=getOrder(id);if(!o)return;
  const paid=mode==='nota',ch=(o.tendered||0)-o.total,S=DB.settings;
  openModal(`<h2>${paid?'Pembayaran berhasil':'Tagihan sementara'}</h2>
    <div class="receipt"><div style="text-align:center"><img src="${LOGO}" alt=""><b>${esc(S.shop)}</b><br>${paid?'Nota':'Tagihan'} ${esc(o.no)}</div><hr>
    <div class="r"><span>${fmtDate(o.createdAt)} ${fmtTime(o.createdAt)}</span></div><div class="r"><span>${esc(o.tableNumber)}</span><span>${esc(o.customerName||'-')}</span></div><hr>
    ${o.items.map(i=>`<div>${esc(i.name)}</div><div class="r"><span>${i.qty} × ${nf(i.price)}</span><span>${nf(i.subtotal)}</span></div>${i.note?`<div style="font-size:11px">* ${esc(i.note)}</div>`:''}`).join('')}<hr>
    <div class="r"><b>TOTAL</b><b>${nf(o.total)}</b></div>
    ${paid?`<div class="r"><span>Bayar (${o.paymentMethod==='Cash'?'Tunai':'QRIS'})</span><span>${nf(o.paymentMethod==='Cash'?o.tendered:o.total)}</span></div>${o.paymentMethod==='Cash'?`<div class="r"><span>Kembali</span><span>${nf(Math.max(0,ch))}</span></div>`:''}`:'<div class="c" style="margin-top:4px;color:var(--warn);font-weight:700">Belum dibayar</div>'}
    ${o.footNote?`<hr><div class="c">${esc(o.footNote)}</div>`:''}
    ${S.wifiSsid||S.wifiPass?`<hr><div class="c wifi"><span>Wifi : ${esc(S.wifiSsid||'-')}</span><span>Pass : ${esc(S.wifiPass||'-')}</span></div>`:''}</div>
    <div class="row" style="justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button class="btn" onclick="printReceipt(${o.id},'${mode}')">Cetak ${paid?'nota':'tagihan'}</button><button class="btn primary" onclick="closeModal()">Selesai</button></div>`,true);
}
function showReceipt(id){receiptModal(id,'nota')}
function openBills(){
  const bills=DB.orders.filter(o=>o.status==='Open Bill').sort((a,b)=>b.createdAt-a.createdAt);
  openModal(`<h2>Open Bill (${bills.length})</h2>${bills.length?bills.map(o=>`<div class="billcard"><div class="row" style="justify-content:space-between"><b>${esc(o.no)} · ${esc(o.tableNumber)}${o.customerName?' · '+esc(o.customerName):''}</b><b>${rp(o.total)}</b></div>
    <div class="note">${fmtTime(o.createdAt)} · ${o.items.map(i=>i.qty+'× '+esc(i.name)+(i.note?' ('+esc(i.note)+')':'')).join(', ')}</div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm" onclick="loadBill(${o.id})">Tambah item</button><button class="btn sm accent" onclick="closeModal();openPay(${o.id})">Lunasi</button><button class="btn sm" onclick="receiptModal(${o.id},'prebill')">Cetak tagihan</button><button class="btn sm danger" onclick="askConfirm('Batalkan Open Bill ${esc(o.no)}? Stok dikembalikan dan jurnal dihapus.',()=>cancelBill(${o.id}))">Batalkan</button></div></div>`).join(''):'<div class="empty">Tidak ada bill terbuka. Pesanan “Bayar nanti” akan muncul di sini.</div>'}
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>`);
}
function loadBill(id){const o=getOrder(id);cart={orderId:o.id,table:o.tableNumber,name:o.customerName,items:o.items.filter(i=>getMenu(i.menuId)).map(i=>({menuId:i.menuId,qty:i.qty,note:i.note||''}))};posStep='order';closeModal();render();toggleOrder(true)}
function cancelBill(id){const o=getOrder(id);unpostOrder(o);o.status='Canceled';save();toast('Transaksi '+o.no+' dibatalkan');if(cart.orderId===id)resetCart();if(view==='kasir')render();}

/* ---------- LAPORAN (harian / mingguan / bulanan) ---------- */
let repMode='harian',repDate=todayKey();
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d.getTime())};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const weekStartKey=k=>{const d=new Date(k+'T12:00:00');return addDays(k,-((d.getDay()+6)%7))};
function monthBounds(k){const y=+k.slice(0,4),m=+k.slice(5,7);return[k.slice(0,8)+'01',dkey(new Date(y,m,0,12).getTime())]}
const fmtK=(k,o)=>new Date(k+'T12:00:00').toLocaleDateString('id-ID',o||{day:'numeric',month:'short'});
const dayName=k=>new Date(k+'T12:00:00').toLocaleDateString('id-ID',{weekday:'short'});
function period(){
  const k=repDate,today=todayKey();let from,to,label,pf,prevName;
  if(repMode==='harian'){from=to=k;label=new Date(k+'T12:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});pf=addDays(k,-1);prevName='kemarin'}
  else if(repMode==='mingguan'){from=weekStartKey(k);to=addDays(from,6);label='Minggu '+fmtK(from)+' – '+fmtK(to,{day:'numeric',month:'short',year:'numeric'});pf=addDays(from,-7);prevName='minggu lalu'}
  else{[from,to]=monthBounds(k);label=new Date(from+'T12:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});pf=monthBounds(addDays(from,-1))[0];prevName='bulan lalu'}
  const curEnd=to<today?to:today,n=Math.max(1,diffDays(from,curEnd)+1),lim=addDays(from,-1);
  let pt=addDays(pf,n-1);if(pt>lim)pt=lim;
  return{from,to,label,pf,pt,prevName,elapsed:n};
}
function rangeStats(fk,tk){
  const S={os:[],food:0,drink:0,revF:0,revB:0,rev:0,cogs:0,paid:0,open:0,byMenu:{},byHour:{},byDay:{},cashIn:0,qrisIn:0,opex:0,spoil:0};
  for(let k=fk;k<=tk;k=addDays(k,1))S.byDay[k]={rev:0,cogs:0,orders:0,food:0,drink:0};
  DB.orders.forEach(o=>{
    if(o.status==='Paid'&&(()=>{const pk=dkey(o.paidAt||o.createdAt);return pk>=fk&&pk<=tk})()){if(o.paymentMethod==='Cash')S.cashIn+=o.total;else S.qrisIn+=o.total}
    if(o.status==='Canceled')return;
    const k=dkey(o.createdAt);if(k<fk||k>tk)return;
    const d=S.byDay[k];S.os.push(o);S.rev+=o.total;S.cogs+=o.cogs;d.rev+=o.total;d.cogs+=o.cogs;d.orders++;
    if(o.status==='Paid')S.paid+=o.total;else S.open+=o.total;
    const h=new Date(o.createdAt).getHours();S.byHour[h]=(S.byHour[h]||0)+o.total;
    o.items.forEach(i=>{if(i.category==='Makanan'){S.food+=i.qty;d.food+=i.qty;S.revF+=i.subtotal}else{S.drink+=i.qty;d.drink+=i.qty;S.revB+=i.subtotal}
      const b=S.byMenu[i.name]||(S.byMenu[i.name]={qty:0,rev:0,cogs:0});b.qty+=i.qty;b.rev+=i.subtotal;b.cogs+=i.cogs});
  });
  const f=new Date(fk+'T00:00:00').getTime(),t=new Date(tk+'T23:59:59.999').getTime(),e3=accSum('503',f,t),e2=accSum('502',f,t);
  S.opex=e3.d-e3.c;S.spoil=e2.d-e2.c;return S;
}
const dayStats=k=>rangeStats(k,k);
const repTitle=()=>({harian:'Rekap Harian',mingguan:'Rekap Mingguan',bulanan:'Rekap Bulanan'})[repMode];
function setRepMode(m){
  if(m!=='harian'&&DB.settings.pinHash&&!owner){askPin(()=>setRepMode(m));return}
  repMode=m;renderLaporan();
}
function shiftPeriod(dir){
  const P=period();
  if(repMode==='harian')repDate=addDays(P.from,dir);
  else if(repMode==='mingguan')repDate=addDays(P.from,7*dir);
  else repDate=dir>0?addDays(P.to,1):addDays(P.from,-1);
  if(repDate>todayKey())repDate=todayKey();
  renderLaporan();
}
function weekRows(P,S){
  const rows=[],today=todayKey();let s=P.from,i=1;
  while(s<=P.to){
    const e0=addDays(weekStartKey(s),6),e=e0<P.to?e0:P.to,r={i,s,e,rev:0,cogs:0,orders:0};
    for(let k=s;k<=e;k=addDays(k,1)){const d=S.byDay[k];r.rev+=d.rev;r.cogs+=d.cogs;r.orders+=d.orders}
    const last=e<today?e:today;r.days=s>today?0:diffDays(s,last)+1;r.avg=r.days?r.rev/r.days:0;
    rows.push(r);s=addDays(e,1);i++;
  }
  return rows;
}
const dl=(c,p,lab)=>p>0?`<span class="dl ${c>=p?'up':'dn'}">${c>=p?'▲':'▼'} ${Math.abs(Math.round((c-p)/p*100))}% vs ${lab}</span>`:'';

  const days=Object.keys(S.byDay).sort(),menus=Object.entries(S.byMenu).sort((a,b)=>b[1].rev-a[1].rev);

  }else{
    const mxr=Math.max(1,...days.map(k=>S.byDay[k].rev));

    }else{
      const W=weekRows(P,S);
      tbl=`<div class="panel"><h3>Perkembangan per minggu</h3><div class="tablewrap"><table><thead><tr><th>Minggu</th><th class="num">Trx</th><th class="num">Penjualan</th><th class="num">Margin</th><th class="num">Rata-rata/hari</th><th class="num">Tren</th></tr></thead><tbody>${W.map((r,i)=>{const pv=i?W[i-1].avg:0,tr=pv>0&&r.days?Math.round((r.avg-pv)/pv*100):null;
        return `<tr><td>${r.i} <span class="note">${esc(fmtK(r.s))}–${esc(fmtK(r.e))}${r.days<7?' · '+r.days+' hari':''}</span></td><td class="num">${r.orders}</td><td class="num">${rp(r.rev)}</td><td class="num">${rp(r.rev-r.cogs)}</td><td class="num">${rp(r.avg)}</td><td class="num">${tr===null?'–':`<span class="tag ${tr>=0?'ok':'bad'}">${tr>=0?'▲':'▼'} ${Math.abs(tr)}%</span>`}</td></tr>`}).join('')}</tbody></table></div><p class="note">Tren membandingkan rata-rata penjualan per hari dengan minggu sebelumnya, sehingga minggu yang belum penuh tetap adil.</p></div>`;
    }

  }
  const totCat=S.revF+S.revB,pF=totCat?Math.round(S.revF/totCat*100):0;

    <div class="dlist"><div class="di"><span><i class="dot" style="background:var(--blue)"></i>Makanan · ${S.food} item</span><b>${pF}%</b></div><div class="di"><span style="color:var(--muted);padding-left:16px">${rp(S.revF)}</span></div>

    :'<div class="empty">Belum ada penjualan pada periode ini.</div>';
  const kpis=harian?'':`<div class="kpis"><div class="kpi"><div class="k">Rata-rata / hari</div><div class="v">${rp(S.rev/P.elapsed)}</div></div>
    <div class="kpi"><div class="k">Rata-rata / transaksi</div><div class="v">${rp(S.os.length?S.rev/S.os.length:0)}</div></div>
    <div class="kpi"><div class="k">Hari terbaik</div><div class="v">${best?esc(dayName(best)+' '+fmtK(best)):'–'}</div><div class="k">${best?rp(S.byDay[best].rev):''}</div></div>
    <div class="kpi"><div class="k">Beban operasional</div><div class="v">${rp(S.opex)}</div></div>
    <div class="kpi"><div class="k">Selisih stok / spoilage</div><div class="v">${rp(S.spoil)}</div></div>

  $('#main').innerHTML=`<div class="page-h"><div><h1>Laporan penjualan</h1><div class="sub">${esc(P.label)}</div></div>

function mUnit(){const u=$('#mu').value.trim()||'satuan';document.querySelectorAll('.mulab').forEach(e=>e.textContent=u);matNote()}
function calcUnitPrice(){
  const b=+($('#mb').value.replace(/\D/g,'')||0),q=parseNum($('#mq').value);
  if(b>0&&q>0)$('#mc').value=String(Math.round(b/q*10000)/10000);
  matNote();
}
function matNote(){
  const u=$('#mu').value.trim()||'satuan',b=+($('#mb').value.replace(/\D/g,'')||0),q=parseNum($('#mq').value),c=parseNum($('#mc').value);
  let s=[];
  if(b>0&&q>0)s.push(`${rp(b)} ÷ ${nf(q)} ${esc(u)} = <b>${rpd(b/q)} per ${esc(u)}</b>`);
  const m=matEdit?getMat(matEdit):null;
  if(m&&c>=0&&Math.abs(c-m.cost)>0.0001){
    s.push(`Harga lama ${rpd(m.cost)} → baru ${rpd(c)} per ${esc(u)}.`);
    if(m.stock>0)s.push(`Nilai persediaan (${nf(m.stock)} ${esc(m.unit)}) disesuaikan ${rp(Math.round(m.stock*(c-m.cost)))} dan dicatat di jurnal.`);
    s.push('HPP menu yang memakai bahan ini ikut berubah untuk penjualan berikutnya.');
  }
  $('#mnote').innerHTML=s.join('<br>');
}
function saveMat(){
  const name=$('#mn').value.trim(),unit=$('#mu').value.trim(),min=+$('#mm').value||0,cost=parseNum($('#mc').value);
  if(!name||!unit){toast('Isi nama dan satuan');return}

  if(matEdit){
    const m=getMat(matEdit),old=m.cost;m.name=name;m.unit=unit;m.minStock=min;m.cost=cost;
    const adj=m.stock>0?Math.round(m.stock*(cost-old)):0;
    if(adj!==0){
      addJournal('Revaluasi',m.id,'Penyesuaian harga '+name+' '+rpd(old)+' → '+rpd(cost),Date.now(),
        adj>0?[{acc:'103',d:adj},{acc:'502',c:adj}]:[{acc:'502',d:-adj},{acc:'103',c:-adj}]);
    }
  }else DB.materials.push({id:nid(),name,unit,cost,stock:0,minStock:min});
  save();closeModal();renderInventaris();toast('Bahan disimpan');
}

function opRow(id){const m=getMat(id),v=$('#op'+id).value.trim();if(v===''){$('#od'+id).textContent='-';$('#ov'+id).textContent='-';return}
  const a=parseNum(v);if(isNaN(a))return;const d=a-m.stock;$('#od'+id).textContent=(d>0?'+':'')+nf(d)+' '+m.unit;$('#od'+id).style.color=d<0?'var(--danger)':d>0?'var(--ok)':'';$('#ov'+id).textContent=rp(d*m.cost)}
function saveOpname(){
  const lines=[];let loss=0,gain=0;
  DB.materials.forEach(m=>{const v=$('#op'+m.id).value.trim();if(v==='')return;const a=parseNum(v);if(isNaN(a)||a<0)return;const d=a-m.stock;if(Math.abs(d)<1e-9)return;
    const val=Math.round(Math.abs(d)*m.cost);if(d<0)loss+=val;else gain+=val;lines.push({materialId:m.id,name:m.name,system:m.stock,actual:a,diff:d,value:d*m.cost});m.stock=a});
  if(!lines.length){toast('Tidak ada selisih untuk dicatat');return}
  const ts=Date.now(),id=nid(),jl=[],note=$('#opnote').value.trim();
  if(loss)jl.push({acc:'502',d:loss},{acc:'103',c:loss});if(gain)jl.push({acc:'103',d:gain},{acc:'502',c:gain});
  DB.opnames.push({id,ts,note,lines});addJournal('Stock Opname',id,'Stock opname'+(note?': '+note:''),ts,jl);
  save();toast('Opname disimpan · penyusutan '+rp(loss));renderInventaris();
}

let pf=null;
function openPrepForm(id){
  if(!DB.materials.some(m=>!m.prep)){toast('Tambah bahan baku dulu');return}
  const m=id?getMat(id):null;
  pf=m?{id:m.id,isNew:false,name:m.name,unit:m.unit,yield:m.prep.yield,minStock:m.minStock,items:clone(m.prep.items)}:{id:nid(),isNew:true,name:'',unit:'ml',yield:0,minStock:0,items:[]};
  renderPrepForm();
}
function renderPrepForm(){
  const raws=DB.materials.filter(m=>!m.prep);
  openModal(`<h2>${pf.isNew?'Bahan setengah jadi baru':'Ubah bahan setengah jadi'}</h2><div class="formgrid"><label style="grid-column:1/-1">Nama<input value="${esc(pf.name)}" placeholder="mis. Susu Pandan" oninput="pf.name=this.value"></label>
  <label>Satuan hasil<input value="${esc(pf.unit)}" placeholder="ml / gr / pcs" oninput="pf.unit=this.value;calcPrep()"></label>
  <label>Hasil jadi per 1 batch<input inputmode="decimal" value="${pf.yield||''}" placeholder="mis. 1200" oninput="pf.yield=parseNum(this.value)||0;calcPrep()"></label>
  <label>Batas stok menipis<input inputmode="numeric" value="${pf.minStock||0}" oninput="pf.minStock=+this.value||0"></label></div>
  <h3 style="margin:16px 0 8px">Bahan yang dicampur (per 1 batch)</h3>
  ${pf.items.map((it,i)=>`<div class="mrow"><select onchange="pf.items[${i}].materialId=+this.value;renderPrepForm()">${opts(raws,it.materialId,m=>m.id,m=>m.name+' ('+m.unit+')')}</select>
  <input inputmode="decimal" value="${it.qty||''}" placeholder="Jumlah" oninput="pf.items[${i}].qty=parseNum(this.value)||0;calcPrep()"><button class="btn sm danger" onclick="pf.items.splice(${i},1);renderPrepForm()" aria-label="Hapus baris">✕</button></div>`).join('')}
  <button class="btn sm" onclick="pf.items.push({materialId:DB.materials.find(m=>!m.prep).id,qty:0});renderPrepForm()">+ Tambah bahan</button>
  <div class="panel" style="margin-top:14px;background:var(--surface2)" id="pcalc"></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="savePrep()">Simpan</button></div>`,true);
  calcPrep();
}
function calcPrep(){
  let total=0;const rows=pf.items.map(it=>{const r=getMat(it.materialId);const c=r?it.qty*r.cost:0;total+=c;return r?`<div class="row" style="justify-content:space-between"><span>${nf(it.qty)} ${esc(r.unit)} ${esc(r.name)}</span><span>${rp(c)}</span></div>`:''}).join('');
  $('#pcalc').innerHTML=`${rows||'<span class="note">Tambahkan bahan baku yang dicampur.</span>'}<hr style="border:0;border-top:1px solid var(--line)">
  <div class="row" style="justify-content:space-between"><b>Biaya 1 batch</b><b>${rp(total)}</b></div>
  <div class="row" style="justify-content:space-between"><b>Hasil jadi</b><b>${nf(pf.yield)} ${esc(pf.unit)}</b></div>
  <div class="row" style="justify-content:space-between"><b>Harga per ${esc(pf.unit||'satuan')}</b><b>${pf.yield>0?rpd(total/pf.yield):'–'}</b></div>
  <p class="note" style="margin:8px 0 0">Isi “hasil jadi” dengan jumlah akhir setelah dicampur atau dimasak (bukan total bahan). Jika ada penyusutan, harga per satuan otomatis lebih tinggi.</p>`;
}
function savePrep(){
  const items=pf.items.filter(it=>it.qty>0),name=pf.name.trim(),unit=pf.unit.trim();
  if(!name||!unit||!(pf.yield>0)||!items.length){toast('Isi nama, satuan, hasil jadi, dan minimal satu bahan');return}
  const prep={yield:pf.yield,items};
  if(pf.isNew){const m={id:pf.id,name,unit,cost:0,stock:0,minStock:pf.minStock,prep};m.cost=prepEst(m);DB.materials.push(m)}
  else{const m=getMat(pf.id);m.name=name;m.unit=unit;m.minStock=pf.minStock;m.prep=prep;if(m.stock<=0)m.cost=prepEst(m)}
  save();closeModal();renderInventaris();toast('Bahan setengah jadi disimpan');
}
function delPrep(id){
  const m=getMat(id),used=DB.menus.filter(x=>x.recipe.some(r=>r.materialId===id)).map(x=>x.name);
  if(used.length){toast('Masih dipakai di resep: '+used.slice(0,3).join(', '));return}
  if(Math.abs(m.stock)>1e-9){toast('Stok masih '+nf(m.stock)+' '+m.unit+'. Nolkan lewat stock opname dulu.');return}
  askConfirm('Hapus '+m.name+'? Riwayat produksi tetap tersimpan.',()=>{DB.materials=DB.materials.filter(x=>x.id!==id);save();renderInventaris()});
}
let pr=null;
function openProduce(id){const m=getMat(id);pr={id,batches:1,output:m.prep.yield,touched:false,note:''};renderProduce()}
function renderProduce(){
  const m=getMat(pr.id);
  openModal(`<h2>Produksi ${esc(m.name)}</h2><div class="formgrid"><label>Jumlah batch<input id="prb" inputmode="decimal" value="${pr.batches}" oninput="pr.batches=parseNum(this.value)||0;if(!pr.touched){pr.output=Math.round(m.prep.yield*pr.batches*1000)/1000;$('#pro').value=pr.output}calcProduce()"></label>
  <label>Hasil jadi sebenarnya (${esc(m.unit)})<input id="pro" inputmode="decimal" value="${pr.output}" oninput="pr.output=parseNum(this.value)||0;pr.touched=true;calcProduce()"></label>
  <label style="grid-column:1/-1">Catatan (opsional)<input value="" oninput="pr.note=this.value" placeholder="mis. batch pagi"></label></div>
  <div class="panel" style="margin-top:14px;background:var(--surface2)" id="prcalc"></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveProduction()">Catat produksi</button></div>`,true);
  calcProduce();
}
function produceCalc(){
  const m=getMat(pr.id);let cost=0,lack=[];
  const rows=m.prep.items.map(it=>{const r=getMat(it.materialId);if(!r)return null;const q=it.qty*pr.batches,c=q*r.cost;cost+=c;if(r.stock<q)lack.push(r.name);return{r,q,c}}).filter(Boolean);
  const unit=pr.output>0?cost/pr.output:0,avg=m.stock>0&&pr.output>0?(m.stock*m.cost+cost)/(m.stock+pr.output):unit;
  return{m,rows,cost,unit,avg,lack};
}
function calcProduce(){
  const c=produceCalc();
  $('#prcalc').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Bahan</th><th class="num">Dipakai</th><th class="num">Stok</th><th class="num">Biaya</th></tr></thead><tbody>${c.rows.map(x=>`<tr><td>${esc(x.r.name)}</td><td class="num">${nf(x.q)} ${esc(x.r.unit)}</td><td class="num" style="color:${x.r.stock<x.q?'var(--danger)':'inherit'}">${nf(x.r.stock)}</td><td class="num">${rp(x.c)}</td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="justify-content:space-between;margin-top:8px"><b>Total biaya bahan</b><b>${rp(c.cost)}</b></div>
  <div class="row" style="justify-content:space-between"><b>Harga per ${esc(c.m.unit)} (batch ini)</b><b>${pr.output>0?rpd(c.unit):'–'}</b></div>
  <div class="row" style="justify-content:space-between"><b>Harga rata-rata setelah produksi</b><b>${pr.output>0?rpd(c.avg):'–'}</b></div>
  ${c.lack.length?`<p class="note" style="color:var(--danger);margin:8px 0 0">Stok tidak cukup: ${c.lack.map(esc).join(', ')}.${DB.settings.strict?' Produksi diblokir karena mode stok ketat aktif.':' Stok akan menjadi minus.'}</p>`:''}
  <p class="note" style="margin:8px 0 0">Bahan baku berkurang sekarang; nilainya berpindah ke stok bahan setengah jadi (total persediaan tetap). Biaya baru masuk HPP saat menu yang memakainya terjual.</p>`;
}
function saveProduction(){
  const c=produceCalc(),m=c.m;
  if(!(pr.batches>0)||!(pr.output>0)){toast('Isi jumlah batch dan hasil jadi');return}
  if(DB.settings.strict&&c.lack.length){toast('Stok bahan tidak cukup');return}
  const cons={};c.rows.forEach(x=>{x.r.stock-=x.q;cons[x.r.id]=x.q});
  m.cost=m.stock>0?(m.stock*m.cost+c.cost)/(m.stock+pr.output):c.cost/pr.output;m.stock+=pr.output;
  DB.productions.push({id:nid(),ts:Date.now(),prepId:m.id,name:m.name,unit:m.unit,batches:pr.batches,output:pr.output,cost:Math.round(c.cost),consumption:cons,note:pr.note.trim()});
  save();closeModal();renderInventaris();toast('Produksi dicatat: +'+nf(pr.output)+' '+m.unit+' '+m.name);
}
