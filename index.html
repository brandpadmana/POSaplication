function exportModal(key){
  expKey=key;const [title,fn]=EXPORTS[key],rows=fn();
  openModal(`<h2>Export ${title} ke Google Sheets</h2><p class="note">${rows.length} baris. Tab “${title}” di spreadsheet Anda akan ditimpa dengan data terbaru.</p>
  <div class="stack"><div class="row" style="flex-wrap:wrap"><button class="btn primary" onclick="sendExport()" ${CFG.API_URL?'':'disabled'}>Kirim ke Google Sheets</button><button class="btn" onclick="copyTSV()">Salin (tempel manual)</button></div>
  ${CFG.API_URL?'':'<p class="note">Google Sheets belum terhubung. Atur di menu Pengaturan, atau gunakan tombol Salin.</p>'}<div id="expres"></div>
  <textarea class="tsv" readonly onfocus="this.select()" aria-label="Data tabel">${esc(tsvOf(rows))}</textarea></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>`,true);
}
async function sendExport(){
  const [title,fn]=EXPORTS[expKey];$('#expres').textContent='Mengirim…';
  try{const j=await api('export',{title,rows:fn()});$('#expres').innerHTML=`Terkirim ke tab “${esc(title)}”. <a href="${esc(j.url)}" target="_blank" rel="noopener">Buka spreadsheet</a>`}
  catch(e){$('#expres').textContent='Gagal mengirim: '+e.message}
}
function copyTSV(){
  const txt=tsvOf(EXPORTS[expKey][1]()),ok=()=>toast('Tersalin. Tempel di Google Sheets pada sel A1');
  const fb=()=>{const t=document.querySelector('textarea.tsv');t.select();try{document.execCommand('copy')?ok():toast('Salin manual dari kotak teks')}catch(e){toast('Salin manual dari kotak teks')}};
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
}

/* ---------- PENGATURAN ---------- */
/* ---------- absensi karyawan (selfie) ---------- */
let absSel=null,absPhoto=null;
function renderAbsensi(){
  const emps=DB.employees.filter(e=>e.active!==false);
  const rows=DB.attendance.filter(a=>dkey(a.ts)===todayKey()).sort((a,b)=>b.ts-a.ts);
  const sel=emps.find(e=>e.id===absSel);
  $('#main').innerHTML=`<div class="page-h"><div><h1>Absensi Karyawan</h1><div class="sub">Absen masuk/pulang dengan foto selfie sebagai bukti kehadiran. Tersimpan di perangkat dan ikut tersinkron ke server.</div></div>
    <button class="btn" onclick="addEmployee()">+ Karyawan</button></div>
  <div class="two"><div class="stack">
    <div class="panel"><h3>Pilih nama</h3><div class="chips">${emps.map(e=>`<button class="chip ${absSel===e.id?'on':''}" onclick="absPhoto=null;absSel=${e.id};renderAbsensi()">${esc(e.name)}</button>`).join('')||'<p class="note">Belum ada karyawan terdaftar. Tambahkan dulu lewat tombol di atas.</p>'}</div></div>
    ${sel?(()=>{const last=lastAbsToday(sel.id),next=nextAbsType(sel.id);return `<div class="panel"><h3>Ambil foto & absen \u2014 ${esc(sel.name)}</h3>
      <p class="note" style="margin-top:-4px">${last?`Terakhir absen <b>${esc(last.type)}</b> pukul ${fmtTime(last.ts)}. `:'Belum absen hari ini. '}${last&&last.type==='Pulang'?'Sudah lengkap (Masuk & Pulang) hari ini.':`Berikutnya: <b>Absen ${next}</b>.`}</p>
      <label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">\ud83d\udcf7 Ambil selfie<input type="file" accept="image/*" capture="user" style="display:none" onchange="onAbsPhoto(event)"></label>
      <div id="absPrev" style="margin-top:12px"></div></div>`})():''}
    </div>
    <div class="stack"><div class="panel"><h3>Riwayat hari ini</h3><div class="stack">
    ${rows.map(a=>{const e=DB.employees.find(x=>x.id===a.employeeId);return `<div class="billcard" style="display:flex;gap:12px;align-items:center">
      <img src="${a.photo}" alt="" style="width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 52px">
      <div style="flex:1"><b>${esc(e?e.name:'Karyawan dihapus')}</b><div class="note">${esc(a.type)} \u00b7 ${fmtTime(a.ts)}</div></div>
      <button class="btn sm ghost" onclick="askConfirm('Hapus catatan absen ini?',()=>{DB.attendance=DB.attendance.filter(x=>x.id!==${a.id});save();renderAbsensi()})">Hapus</button></div>`}).join('')||'<p class="empty">Belum ada absensi hari ini.</p>'}
    </div></div>
    <div class="panel"><h3>Karyawan terdaftar</h3><div class="stack">
    ${DB.employees.map(e=>`<div class="row" style="justify-content:space-between"><span>${esc(e.name)}${e.active===false?' <span class="tag">Nonaktif</span>':''}</span>
      <span class="row" style="gap:6px"><button class="btn sm ghost" onclick="toggleEmployee(${e.id})">${e.active===false?'Aktifkan':'Nonaktifkan'}</button></span></div>`).join('')||'<p class="note">Belum ada karyawan.</p>'}
    </div></div></div>
  </div>`;
}
function addEmployee(){
  openModal(`<h2>Tambah karyawan</h2><label>Nama<input id="empName" placeholder="mis. Budi Santoso"></label>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveEmployee()">Simpan</button></div>`);
  setTimeout(()=>{const e=$('#empName');e&&e.focus()},50);
}
function saveEmployee(){
  const n=($('#empName').value||'').trim();if(!n)return toast('Nama wajib diisi');
  const id=nid();DB.employees.push({id,name:n,active:true});save();closeModal();toast('Karyawan ditambahkan');absSel=id;render();
}
function toggleEmployee(id){const e=DB.employees.find(x=>x.id===id);e.active=e.active===false?true:false;save();renderAbsensi()}
function lastAbsToday(empId){return DB.attendance.filter(a=>a.employeeId===empId&&dkey(a.ts)===todayKey()).sort((a,b)=>b.ts-a.ts)[0]||null}
function nextAbsType(empId){const last=lastAbsToday(empId);return !last||last.type==='Pulang'?'Masuk':'Pulang'}
async function onAbsPhoto(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  $('#absPrev').innerHTML='<p class="note">Memproses foto…</p>';
  try{
    absPhoto=await readImageCompressed(f,480);
    const next=nextAbsType(absSel),other=next==='Masuk'?'Pulang':'Masuk';
    $('#absPrev').innerHTML=`<img src="${absPhoto}" alt="" style="width:130px;height:130px;border-radius:14px;object-fit:cover">
    <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn accent" onclick="doAbsen('${next}')">Absen ${next}</button><button class="btn sm ghost" onclick="doAbsen('${other}')">Bukan, catat sebagai ${other}</button></div>`;
  }catch(e){toast('Gagal memproses foto');$('#absPrev').innerHTML=''}
}
function doAbsen(type){
  if(!absPhoto)return toast('Ambil foto dulu');
  DB.attendance.push({id:nid(),employeeId:absSel,type,ts:Date.now(),photo:absPhoto});
  save();toast('Absen '+type+' tersimpan');absPhoto=null;renderAbsensi();
}

function renderPengaturan(){
  const S=DB.settings;
  $('#main').innerHTML=`<div class="page-h"><div><h1>Pengaturan</h1><div class="sub">Toko, struk, keamanan, dan koneksi Google Sheets.</div></div></div>
  <div class="two"><div class="stack"><div class="panel"><h3>Template nota</h3><p class="note" style="margin-top:-6px">Ini template dasar semua nota, termasuk WiFi. Menu, harga, qty, meja, dan total tetap variabel otomatis per transaksi.</p><div class="stack">
    <label>Nama toko<input id="sShop" value="${esc(S.shop)}" oninput="tplPrev()"></label><label>Alamat<input id="sAddr" value="${esc(S.address)}" oninput="tplPrev()"></label><label>Telepon<input id="sPhone" value="${esc(S.phone)}" oninput="tplPrev()"></label>
    <label>Jam buka (tampil di struk)<input id="sHours" value="${esc(S.hours)}" oninput="tplPrev()"></label>
    <div class="formgrid"><label>WiFi \u2014 Nama (SSID)<input id="sWifiSsid" value="${esc(S.wifiSsid||'')}" placeholder="mis. Piyee-Guest" oninput="tplPrev()"></label>
    <label>WiFi \u2014 Password<input id="sWifiPass" value="${esc(S.wifiPass||'')}" placeholder="mis. piyee2025" oninput="tplPrev()"></label></div>
    <label>Pesan penutup struk<input id="sFoot" value="${esc(S.footer)}" oninput="tplPrev()"></label>
    <label>Lebar kertas struk<select id="sPaper" onchange="tplPrev()"><option value="58" ${S.paper==='58'?'selected':''}>58 mm</option><option value="80" ${S.paper==='80'?'selected':''}>80 mm</option></select></label>
    <label class="check"><input type="checkbox" id="sAuto" ${S.autoPrint?'checked':''}> Cetak nota otomatis setelah pembayaran</label>
    <label class="check"><input type="checkbox" id="sStrict" ${S.strict?'checked':''}> Blokir penjualan jika stok bahan tidak cukup</label>
    <div class="row" style="flex-wrap:wrap"><button class="btn primary" onclick="saveSettings()">Simpan template</button><button class="btn" onclick="printTest()">Cetak nota contoh</button></div>
    <div><h3 style="font-size:14px;margin:4px 0 8px">Pratinjau nota</h3><p class="note" style="margin:-2px 0 8px">Bagian item, meja, nomor nota, dan total di bawah ini contoh saja \u2014 otomatis mengikuti tiap transaksi.</p><div class="receipt" id="tplPreview"></div></div>
    </div></div>
    <div class="panel"><h3>Keamanan</h3><p class="note">PIN mengunci halaman Menu, Stok, Keuangan, dan Pengaturan dari kasir. Ini kunci tampilan di perangkat; keamanan data tetap bergantung pada token Apps Script.</p>
    <div class="row" style="flex-wrap:wrap"><input id="sPin" type="password" inputmode="numeric" placeholder="PIN baru (kosongkan untuk menghapus)" style="flex:1;min-width:200px"><button class="btn" onclick="savePin()">Simpan PIN</button></div></div></div>
  <div class="stack"><div class="panel"><h3>Google Sheets (penyimpanan data)</h3><div class="stack">
    <label>URL Web App Apps Script<input id="cUrl" value="${esc(CFG.API_URL||'')}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label>Token rahasia<input id="cTok" type="password" value="${esc(CFG.TOKEN||'')}" placeholder="Sama dengan TOKEN di Code.gs"></label>
    <div class="row" style="flex-wrap:wrap"><button class="btn primary" onclick="saveConn()">Simpan & hubungkan</button><button class="btn" onclick="testConn()">Tes koneksi</button></div>
    <div id="connres" class="note">Status: ${!CFG.API_URL?'belum terhubung (mode lokal)':pendingChanges?'ada perubahan menunggu dikirim':'tersinkron'}</div>
    <div class="row" style="flex-wrap:wrap"><button class="btn sm" onclick="resyncAll()">Kirim ulang semua data</button><button class="btn sm" onclick="reloadRemote()">Muat ulang dari Sheets</button></div></div></div>
    <div class="panel"><h3>Kirim semua laporan</h3><p class="note">Menulis tab Laba Rugi, Buku Besar, HPP, dan Rekap (harian/mingguan/bulanan sesuai pilihan di halaman Laporan) ke spreadsheet dalam satu kali klik.</p><button class="btn" onclick="exportAll()" ${CFG.API_URL?'':'disabled'}>Export semua ke Google Sheets</button><div id="allres" class="note" style="margin-top:8px"></div></div>
    <div class="panel"><h3>Foto nota pengeluaran \u2192 Google Docs</h3><p class="note" style="margin-top:-4px">Agar tombol <b>“Kirim ke Docs”</b> di halaman Stok \u2192 Pengeluaran benar-benar menyimpan foto nota ke Google Docs, tempel fungsi berikut ke <b>Code.gs</b> Apps Script Anda (di dalam <code>doPost</code>, tambahkan pemanggilan <code>expensePhotoToDocs(data)</code> saat <code>action==='expensePhotoToDocs'</code>), lalu deploy ulang sebagai Web App versi baru.</p>
    <textarea readonly rows="14" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre">function expensePhotoToDocs(data){
  var folder = DriveApp.getFoldersByName('Piyee - Nota Pengeluaran').hasNext()
    ? DriveApp.getFoldersByName('Piyee - Nota Pengeluaran').next()
    : DriveApp.createFolder('Piyee - Nota Pengeluaran');
  var docName = 'Rekap Nota Pengeluaran';
  var files = folder.getFilesByName(docName + '.gdoc');
  var doc = files.hasNext()
    ? DocumentApp.openById(files.next().getId())
    : DocumentApp.create(docName);
  if (doc.getParents && !folder.getFilesByName(docName).hasNext()) {
    DriveApp.getFileById(doc.getId()).moveTo(folder);
  }
  var body = doc.getBody();
  var b64 = data.photo.split(',')[1];
  var blob = Utilities.newBlob(Utilities.base64Decode(b64), 'image/jpeg', 'nota-' + data.expenseId + '.jpg');
  body.appendParagraph(Utilities.formatDate(new Date(data.ts), 'GMT+7', 'dd MMM yyyy HH:mm') +
    '  \u00b7  ' + data.desc + '  \u00b7  Rp' + data.amount).setBold(true);
  body.appendImage(blob).setWidth(260);
  body.appendParagraph('');
  doc.saveAndClose();
  return { docUrl: doc.getUrl() };
}</textarea>
    <p class="note" style="margin-top:8px">Semua foto akan dikumpulkan berurutan dalam satu Google Doc bernama “Rekap Nota Pengeluaran” di folder Drive akun Anda. Sebelum fungsi ini ditambahkan, foto tetap tersimpan aman di aplikasi dan ikut tersinkron sebagai data biasa \u2014 tombol Kirim ke Docs hanya akan menunggu.</p></div></div></div>`;
  tplPrev();
}
function tplPrev(){
  const el=$('#tplPreview');if(!el)return;
  const S={shop:$('#sShop').value||'Nama Toko',address:$('#sAddr').value,phone:$('#sPhone').value,hours:$('#sHours').value,footer:$('#sFoot').value,wifiSsid:$('#sWifiSsid').value,wifiPass:$('#sWifiPass').value};
  const sample={no:'CONTOH-01',createdAt:Date.now(),tableNumber:'Meja 5',customerName:'Contoh Pelanggan',
    items:[{name:'Kopi Susu Piyee',qty:2,price:16000,subtotal:32000,note:''},{name:'Kentang Goreng',qty:1,price:15000,subtotal:15000,note:''}],
    total:47000,paymentMethod:'Cash',tendered:50000};
  el.innerHTML=receiptInner(sample,'nota',S);
}
function saveSettings(){
  const S=DB.settings;S.shop=$('#sShop').value.trim()||'Piyee Coffee';S.address=$('#sAddr').value.trim();S.phone=$('#sPhone').value.trim();S.hours=$('#sHours').value.trim();S.footer=$('#sFoot').value.trim();
  S.wifiSsid=$('#sWifiSsid').value.trim();S.wifiPass=$('#sWifiPass').value.trim();
  S.paper=$('#sPaper').value;S.autoPrint=$('#sAuto').checked;S.strict=$('#sStrict').checked;save();toast('Template nota disimpan');tplPrev();
}
function printTest(){printDoc(receiptInner({no:'TES-001',createdAt:Date.now(),tableNumber:'Meja 1',customerName:'Contoh',items:[{name:'Kopi Susu Piyee',qty:2,price:16000,subtotal:32000},{name:'Kentang Goreng',qty:1,price:15000,subtotal:15000}],total:47000,paymentMethod:'Cash',tendered:50000},'nota'))}
function savePin(){const v=$('#sPin').value.trim();DB.settings.pinHash=v?hs(v+'~piyee'):'';owner=true;save();renderNav();toast(v?'PIN disimpan':'PIN dihapus')}
function saveConn(){CFG.API_URL=$('#cUrl').value.trim();CFG.TOKEN=$('#cTok').value.trim();saveCfg();toast('Tersimpan. Memuat ulang…');setTimeout(()=>location.reload(),600)}
async function testConn(){
  CFG.API_URL=$('#cUrl').value.trim();CFG.TOKEN=$('#cTok').value.trim();$('#connres').textContent='Menguji…';
  try{const j=await api('ping');$('#connres').innerHTML='<span class="tag ok">Terhubung</span> '+esc(j.sheet||'')}catch(e){$('#connres').innerHTML='<span class="tag bad">Gagal</span> '+esc(e.message)}
}
function resyncAll(){synced={};pendingChanges=true;flush();toast('Mengirim ulang semua data…')}
async function reloadRemote(){try{await pullNow();setStatus('ok');toast('Data dimuat dari Google Sheets');render()}catch(e){toast('Gagal: '+e.message)}}
async function exportAll(){
  const r=$('#allres');r.textContent='Mengirim…';
  try{EXPORTS.laporan[0]=repTitle();for(const k of ['lr','bb','hpp','laporan']){await api('export',{title:EXPORTS[k][0],rows:EXPORTS[k][1]()})}r.textContent='Semua laporan terkirim.'}catch(e){r.textContent='Gagal: '+e.message}
}

/* ---------- mulai ---------- */
window.addEventListener('error',e=>{const b=$('#boot');if(b)b.innerHTML='<div style="padding:24px">Terjadi kesalahan saat memuat: '+esc(e.message)+'</div>'});
init();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
